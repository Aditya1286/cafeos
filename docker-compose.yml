version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: cafeos_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cafeos
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cafeos_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      PORT: 5000
      NODE_ENV: production
      # Always the in-network hostname — never read from .env, which points at
      # 127.0.0.1 for local (non-Docker) development instead.
      MONGO_URI: mongodb://mongodb:27017/cafeos
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cafeos_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
