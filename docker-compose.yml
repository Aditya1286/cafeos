services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cafeos_backend
    restart: always
    ports:
      - "5000:5000"
    # MongoDB is no longer part of this stack — it's a separate connection the backend
    # reaches over the network (self-hosted, Atlas, a replica set, etc.). The backend
    # reads no .env file and no other env vars at all — every setting (Mongo host/port/
    # db name, replica set, JWT secret, ...) comes from backend/config.production.json,
    # baked into the image (see backend/Dockerfile and src/config/index.ts). Edit that
    # file — not this one — to point at a real Mongo instance before deploying for real.
    environment:
      # The one exception: NODE_ENV is what picks config.<env>.json in the first place,
      # so it has to be a real env var rather than living inside that same file.
      NODE_ENV: production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cafeos_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
