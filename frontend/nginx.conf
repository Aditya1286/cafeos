server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing — unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API — proxied to the backend container by its Compose service name
    location /api/v1/ {
        proxy_pass http://backend:5000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Upload Menu (AI import) — up to 6 menu photos in one JSON body, and the AI can take a
    # couple of minutes to read them. nginx's defaults (1MB body, 60s read timeout) would cut
    # both off. Longest-prefix match, so this wins over /api/v1/ above for these paths only.
    location /api/v1/menu/import/ {
        client_max_body_size 10m;
        proxy_read_timeout 210s;
        proxy_send_timeout 210s;
        proxy_pass http://backend:5000/api/v1/menu/import/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO — the Upgrade/Connection headers must be forwarded explicitly,
    # otherwise the WebSocket handshake fails silently and it falls back to
    # slow long-polling instead of a real live connection.
    location /socket.io/ {
        proxy_pass http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
